services:
  - type: web
    name: decp-contracts-rag
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: LLM_PROVIDER
        value: mistral
      - key: CHUNK_STRATEGY
        value: recursive
      - key: MISTRAL_API_KEY
        sync: false
